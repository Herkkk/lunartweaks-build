name: Build LunarTweaks
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Tests and static Windows build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          ( g++ -std=c++20 -Wall -Wextra -Werror tests/reg_tweaks_test.cpp -o reg_test && ./reg_test &&
            g++ -std=c++20 -Wall -Wextra -Werror tests/adaptive_power_test.cpp -o power_test && ./power_test &&
            CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres bash build-mingw.sh ) 2>&1 | tee out/mingw.log
          echo "status=$?" >> out/mingw.log
      - name: Publish result branch
        if: always()
        shell: bash
        run: |
          [ -d dist ] && cp -r dist out/dist || true
          cd out && git init -q -b ci-mingw && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "mingw ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-mingw
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: MSVC build
        shell: bash
        run: |
          mkdir -p out
          cmake -S . -B build -A x64 > out/msvc.log 2>&1
          cmake --build build --config Release >> out/msvc.log 2>&1; echo "status=$?" >> out/msvc.log
      - name: Publish result branch
        if: always()
        shell: bash
        run: |
          cd out && git init -q -b ci-msvc && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "msvc ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}" ci-msvc
