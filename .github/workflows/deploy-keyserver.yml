name: Deploy key server
on:
  workflow_dispatch:
  push:
    paths: ["keyserver/**", ".github/workflows/deploy-keyserver.yml"]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: keyserver
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Tests
        run: npm test
      - name: Check setup
        id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare secrets are not set yet, so the key server was tested but not deployed. See KEYSERVER-SETUP.md."
            echo "deploy=no" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Custom domain
        if: steps.ready.outputs.deploy == 'yes' && vars.KEYS_DOMAIN != ''
        run: printf '\nroutes = [{ pattern = "%s", custom_domain = true }]\n' "${{ vars.KEYS_DOMAIN }}" >> wrangler.toml
      - name: Deploy
        if: steps.ready.outputs.deploy == 'yes'
        run: npm install --no-audit --no-fund && npx wrangler deploy
      - name: Secrets
        if: steps.ready.outputs.deploy == 'yes'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PRICE_ID SIGNING_KEY ADMIN_TOKEN RESEND_API_KEY EMAIL_FROM; do
            value="${!name}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$name" >/dev/null && echo "set $name"; else echo "skipped $name (not set)"; fi
          done
