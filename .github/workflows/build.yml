name: Build LunarTweaks
on: [push, workflow_dispatch]
jobs:
  mingw:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64
      - name: Unit tests (registry + power engines)
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/reg_tweaks_test.cpp -o reg_test && ./reg_test
          g++ -std=c++20 -Wall -Wextra -Werror tests/adaptive_power_test.cpp -o power_test && ./power_test
      - name: Static Windows build (warnings are errors)
        run: CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres bash build-mingw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LunarTweaks-mingw
          path: dist/
  msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release
